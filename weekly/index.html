<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<title>현암 선생 주간운세 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 밤하늘 먹빛 바탕 위 금박 테두리 카드, 오방색으로 간지를 물들이는 단일 다크 테마 */
:root{
  --paper:#0C1222; --paper2:#121A30; --sheet:rgba(255,255,255,.035); --sheet2:rgba(255,255,255,.06);
  --ink:#EEE7D7; --muted:#A3A7B7; --line:rgba(214,178,110,.20); --line2:rgba(214,178,110,.42);
  --gold:#D6B26E; --gold2:#F1D9A0; --seal:#E8735A; --water:#86C9DA; --water-soft:rgba(134,201,218,.13);
  --g5:#5CC8B4; --g4:#7FAED0; --g3:#9399AE; --g2:#DDAA5A; --g1:#E8845F; --g0:#EC5F4F;
  --chip-good:rgba(92,200,180,.14); --chip-bad:rgba(236,95,79,.15); --chip-mid:rgba(255,255,255,.07);
  --e-wood:#62C795; --e-fire:#F0715A; --e-earth:#E0B25E; --e-metal:#E4E6F0; --e-water:#7C9CF0;
  --display:"Song Myung","Nanum Myeongjo","AppleMyungjo",serif;
  --serif:"Nanum Myeongjo","AppleMyungjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}

/* 레이아웃: 왼쪽 고정 목차 + 오른쪽 한 줄 길이 제한 본문. 한지 바탕, 인주(붉은 도장)와 물빛 강조 */
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.75;word-break:keep-all}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 72px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:500}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:28px}
header.top h1{font-size:clamp(28px,5vw,42px);line-height:1.2}
header.top .who{color:var(--muted);font-size:14px}
.seal{display:inline-grid;place-items:center;width:52px;height:52px;border:2px solid var(--seal);color:var(--seal);font-family:var(--display);font-weight:700;font-size:15px;line-height:1.1;text-align:center;border-radius:6px;transform:rotate(-4deg)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr;gap:20px}}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow-y:auto;font-size:13px;line-height:1.5;padding-right:6px}
nav.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
nav.toc a{color:var(--muted);text-decoration:none;display:grid;grid-template-columns:2em 1fr;padding:2px 0}
nav.toc a:hover,nav.toc a:focus-visible{color:var(--ink)}
nav.toc a.on{color:var(--seal);font-weight:600}
nav.toc .tt{font-size:12px;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
@media (max-width:900px){nav.toc{position:static;max-height:none;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
  nav.toc ol{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px}}
main{min-width:0;display:grid;gap:0}
section.s{padding-block:30px;border-top:1px solid var(--line);scroll-margin-top:16px;display:grid;gap:14px}
section.s:first-child{border-top:0;padding-top:0}
section.s > h2{font-size:24px;display:flex;gap:12px;align-items:baseline}
section.s > h2 .no{font-family:var(--body);font-size:13px;color:var(--seal);font-weight:600;font-variant-numeric:tabular-nums;min-width:1.8em}
section.s h3{font-size:18px;margin-top:6px}
p{margin:0;max-width:72ch}
.tag{display:inline-block;font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.04em;padding:1px 8px;border-radius:3px;margin-right:6px;vertical-align:2px}
.t-c{background:var(--chip-mid);color:var(--ink)} .t-i{background:var(--water-soft);color:var(--water)} .t-r{background:var(--chip-bad);color:var(--seal)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted)}
.lead{font-family:var(--display);font-size:clamp(17px,2.2vw,20px);line-height:1.75;max-width:62ch}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55}
th,td{padding:8px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
thead th{border-top:0;font-weight:600;color:var(--muted);font-size:12.5px;letter-spacing:.04em;white-space:nowrap}
tbody th{font-weight:600;white-space:nowrap}
td.num,th.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:620px}
.pil{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:12px 8px;text-align:center;display:grid;gap:4px}
.pil .lab{font-size:12px;color:var(--muted)}
.pil .ch{font-family:var(--display);font-size:clamp(22px,4vw,30px);font-weight:700;line-height:1.15}
.pil .na{font-size:12px;color:var(--muted);line-height:1.35}
.pil .tg{font-size:12px;font-weight:600;color:var(--water)}
.pil.me{border-color:var(--seal)} .pil.me .lab{color:var(--seal)}
.bars{display:grid;gap:8px;max-width:620px}
.bar{display:grid;grid-template-columns:4.5em minmax(0,1fr) 6.5em;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:10px;background:var(--chip-mid);border-radius:2px;overflow:hidden}
.bar .fl{height:100%;border-radius:2px}
.bar .lv{font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:700px){.cards{grid-template-columns:1fr}}
.card{min-width:0;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:grid;gap:6px;font-size:14.5px}
.card h4{margin:0;font-family:var(--display);font-size:16.5px}
.card dl{margin:0;display:grid;gap:4px}
.card dl div{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:8px}
.card dt{color:var(--muted);font-size:13px}
.card dd{margin:0}
.card.good{border-top:3px solid var(--water)} .card.bad{border-top:3px solid var(--seal)}
ul.plain{margin:0;padding-left:1.15em;display:grid;gap:4px;max-width:72ch}
.pair{display:grid;grid-template-columns:minmax(0,1fr);gap:0;max-width:76ch}
.pair div{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.pair div:first-child{border-top:0}
.pair b{font-weight:600}
@media (max-width:520px){.pair div,.card dl div{grid-template-columns:1fr;gap:2px}}
.lv-s{color:var(--water);font-weight:600} .lv-m{color:var(--muted);font-weight:600} .lv-w{color:var(--seal);font-weight:600}
.score{font-variant-numeric:tabular-nums;font-weight:600}
.saying{font-family:var(--display);font-size:clamp(19px,2.6vw,23px);line-height:1.7;border-left:3px solid var(--seal);padding-left:18px;max-width:56ch;margin:0}
.saying small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);margin-top:8px}
.note{font-size:13px;color:var(--muted);max-width:76ch}
a{color:var(--water)}
a:focus-visible{outline:2px solid var(--water);outline-offset:2px}

/* ===== 사주 홈페이지 테마 덧씌움 ===== */
html{background:var(--paper)}
body{background-color:var(--paper);color:var(--ink);
  background-image:
    radial-gradient(1200px 600px at 85% -10%, rgba(214,178,110,.10), transparent 60%),
    radial-gradient(900px 700px at -10% 30%, rgba(60,110,160,.16), transparent 60%),
    radial-gradient(800px 600px at 110% 90%, rgba(40,120,120,.12), transparent 60%),
    radial-gradient(1.2px 1.2px at 20px 30px, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1px 1px at 120px 80px, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.4px 1.4px at 200px 150px, rgba(241,217,160,.45), transparent 60%),
    radial-gradient(1px 1px at 60px 190px, rgba(255,255,255,.3), transparent 60%);
  background-size:auto,auto,auto,240px 240px,240px 240px,240px 240px,240px 240px;
  background-attachment:fixed}
::selection{background:rgba(214,178,110,.35)}
a{color:var(--gold2)}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;letter-spacing:.01em}
.eyebrow{color:var(--gold);letter-spacing:.32em;font-size:12px}

/* 머리글: 금박 테두리 히어로 */
header.top{position:relative;overflow:hidden;border:1px solid var(--line2);border-radius:24px;padding:clamp(24px,4vw,44px);
  background:linear-gradient(135deg,rgba(214,178,110,.10),rgba(255,255,255,.02) 40%,rgba(124,156,240,.06));
  box-shadow:0 30px 80px -40px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.06);align-items:center;margin-bottom:8px}
header.top::before{content:"";position:absolute;inset:10px;border:1px solid var(--line);border-radius:16px;pointer-events:none}
header.top > div:first-child{position:relative;z-index:1;display:grid;gap:10px;min-width:0;flex:1 1 320px}
header.top h1{font-size:clamp(30px,5.4vw,52px);line-height:1.2;
  background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,#B08A48);-webkit-background-clip:text;background-clip:text;color:transparent}
header.top .who{color:var(--muted);font-size:13.5px;line-height:1.7}
.wheel{position:relative;z-index:1;width:clamp(130px,22vw,200px);aspect-ratio:1;max-width:100%;flex:0 0 auto}
.wheel svg{width:100%;height:100%;overflow:visible}
.wheel .spin{transform-origin:100px 100px;animation:spin 160s linear infinite}
.wheel .spin2{transform-origin:100px 100px;animation:spin 90s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
header.top > div:first-child{animation:rise .9s ease-out both}
@media (prefers-reduced-motion:reduce){.wheel .spin,.wheel .spin2,header.top > div:first-child{animation:none}}

/* 섹션 제목 */
section > h2, section.s > h2{font-size:clamp(24px,3.2vw,30px);color:var(--ink);display:flex;align-items:center;gap:14px}
section > h2::before{content:"";width:9px;height:9px;flex:0 0 auto;transform:rotate(45deg);border:1px solid var(--gold);background:rgba(214,178,110,.25)}
section.s > h2::before{display:none}
section.s > h2 .no{display:inline-grid;place-items:center;min-width:34px;height:34px;border:1px solid var(--line2);border-radius:50%;color:var(--gold);font-family:var(--display);font-size:15px;font-weight:400}
section.s{border-top:1px solid var(--line)}
.lead{color:#D9D2C2}
p{color:#DDD6C6}

/* 공통 판넬 */
.panel,.pil,.chartbox,.tbl,.card,.dw,.cell{border-color:var(--line)!important}
.panel,.chartbox,.tbl,.card,.dw{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:18px;
  box-shadow:0 20px 50px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(6px)}
.chartbox{padding:18px 14px 8px}

/* 원국 기둥: 오방색 타일 */
.pillars{gap:10px}
.pil{border-radius:18px;padding:16px 8px 14px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--line);gap:6px}
.pil .lab{color:var(--gold);letter-spacing:.12em}
.pil .ch{font-family:var(--display);font-size:clamp(30px,5vw,42px);font-weight:400;width:1.6em;height:1.6em;display:grid;place-items:center;margin:2px auto;border-radius:14px;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.12),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08)}
.pil .na{color:var(--muted)}
.pil .tg{color:var(--gold2);font-weight:500}
.pil.me{border-color:var(--gold)!important;box-shadow:0 0 0 1px rgba(214,178,110,.35),0 0 40px -10px rgba(214,178,110,.45)}
.pil.me .lab{color:var(--gold2)}
[data-el="wood"]{color:var(--e-wood)!important} [data-el="fire"]{color:var(--e-fire)!important} [data-el="earth"]{color:var(--e-earth)!important}
[data-el="metal"]{color:var(--e-metal)!important} [data-el="water"]{color:var(--e-water)!important}
.pil .ch[data-el]{text-shadow:0 0 18px currentColor}
.pil .ch[data-el="wood"]{border-color:rgba(98,199,149,.35)} .pil .ch[data-el="fire"]{border-color:rgba(240,113,90,.35)}
.pil .ch[data-el="earth"]{border-color:rgba(224,178,94,.35)} .pil .ch[data-el="metal"]{border-color:rgba(228,230,240,.35)} .pil .ch[data-el="water"]{border-color:rgba(124,156,240,.35)}

/* 칩·태그 */
.chip{border-radius:999px;padding:3px 11px;border:1px solid rgba(255,255,255,.07);color:var(--ink)}
.chip.good{border-color:rgba(92,200,180,.3)} .chip.bad{border-color:rgba(236,95,79,.3)}
.med{border:1px solid rgba(255,255,255,.08)} .med.w{color:var(--g5)} .med.b{color:var(--seal)}
.tag{border-radius:999px}
.t-c{background:rgba(255,255,255,.08);color:var(--ink)} .t-i{background:rgba(134,201,218,.14);color:var(--water)} .t-r{background:rgba(232,115,90,.15);color:var(--seal)}

/* 표 */
table{color:var(--ink)}
thead th{color:var(--gold);letter-spacing:.08em;background:rgba(214,178,110,.06)}
th,td{border-top:1px solid var(--line)}
tbody tr:hover td,tbody tr:hover th{background:rgba(255,255,255,.025)}
table.calc th{color:var(--gold)}

/* 점수 숫자 */
.score .n,.meta .sc .n,.yc .n,.score .n{font-family:var(--display);font-weight:400;text-shadow:0 0 24px currentColor}
.ok{color:var(--g5);font-family:var(--display);font-weight:400;font-size:22px}
.ok::before{content:"";width:22px;height:22px;border-radius:50%;border:1px solid var(--g5);background:radial-gradient(circle,rgba(92,200,180,.5),transparent 70%)}

/* 일진 달력 */
.tab{border-color:var(--line2);color:var(--ink);background:transparent;font-family:var(--display);font-size:15px;padding:6px 18px}
.tab[aria-selected="true"]{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1A1408;border-color:var(--gold)}
.dow{color:var(--gold)} .dow.sun{color:var(--seal)}
.cell{border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line);transition:transform .15s ease,background .15s ease}
.cell:not(.out):not(.empty):hover{transform:translateY(-2px);background:rgba(214,178,110,.08)}
.cell .gz{font-family:var(--display);font-size:13px}
.cell .bar{height:4px;border-radius:99px;box-shadow:0 0 10px currentColor}
.cell[aria-pressed="true"]{outline:none;border-color:var(--gold)!important;box-shadow:0 0 0 1px var(--gold),0 0 24px -6px rgba(214,178,110,.6);background:rgba(214,178,110,.10)}
.cell.today .dn::after{color:var(--gold2)}
.cell .jq{color:var(--gold2)}
.panel{padding:26px clamp(18px,3vw,32px)}
.ph .gzbig{font-family:var(--display);font-weight:400;font-size:36px}
.panel h3{font-family:var(--serif);font-weight:800;font-size:21px;color:var(--gold2)}
.glyph{border-left-width:2px}
.navrow button,.mnav button{border-color:var(--line2);color:var(--ink);background:rgba(255,255,255,.03)}
.navrow button:hover,.mnav button:hover{border-color:var(--gold);color:var(--gold2)}
.mnav{background:rgba(12,18,34,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.mnav .yr{color:var(--gold)}

/* 월운·대운 카드 */
.mcard,.yc{border-top-width:2px;padding:18px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.month{border-top:1px solid var(--line);padding-block:34px}
.meta .gzb{font-family:var(--display);font-weight:400;font-size:46px}
.meta .lab{color:var(--gold);letter-spacing:.12em}
.body h3,.mcard h3,.yc h3{color:var(--gold2)}
.body h3{font-family:var(--serif);font-weight:800}
.strip div{background:rgba(255,255,255,.04);border-radius:8px}
.past{background:rgba(214,178,110,.12);color:var(--gold2);border:1px solid var(--line2)}
.doms div.plan dt{color:var(--gold2)}
.dlink{color:var(--water)} .dlink.bad{color:var(--seal)}

/* 원국 리포트 */
nav.toc a{color:var(--muted)} nav.toc a.on{color:var(--gold2)} nav.toc .tt{color:var(--gold)}
.card.good{border-top:2px solid var(--g5)!important} .card.bad{border-top:2px solid var(--seal)!important}
.card h4{color:var(--gold2)}
.bar .tr{background:rgba(255,255,255,.06);border-radius:99px;height:8px}
.bar .fl{border-radius:99px;box-shadow:0 0 14px currentColor}
.lv-s{color:var(--g5)} .lv-w{color:var(--seal)} .lv-m{color:var(--muted)}

/* 한마디 */
.saying{position:relative;border:1px solid var(--line2);border-left:1px solid var(--line2);border-radius:22px;padding:34px clamp(22px,4vw,46px) 26px;max-width:none;
  background:radial-gradient(600px 200px at 50% 0%,rgba(214,178,110,.12),transparent 70%),rgba(255,255,255,.02);
  font-family:var(--serif);font-weight:700;color:var(--ink);text-align:center}
.saying::before{content:"";display:block;width:160px;height:1px;margin:0 auto 24px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.saying::after{content:"";position:absolute;top:34px;left:50%;width:7px;height:7px;transform:translate(-50%,-50%) rotate(45deg);background:var(--paper2);border:1px solid var(--gold)}
.saying small{color:var(--gold);letter-spacing:.24em;font-weight:500}
.notes,.note{color:var(--muted)}
.notes a,.note a{color:var(--gold2)}

.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:960px){.trio{grid-template-columns:1fr}}
.person{min-width:0;display:grid;gap:12px;padding:20px 16px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015))}
.person .who2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.person .who2 h3{font-size:24px}
.person .who2 span{font-size:12.5px;color:var(--muted)}
.person .pillars{grid-template-columns:repeat(4,minmax(0,1fr));max-width:none;gap:6px}
.person .pil{padding:10px 4px;border-radius:14px}
.person .pil .ch{font-size:clamp(24px,3.4vw,32px)}
.person .pil .na{font-size:11px}
.person .ess{font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.6}
.kv{display:grid;gap:6px;font-size:13.5px}
.kv div{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:8px}
.kv dt{color:var(--gold)} .kv dd{margin:0}
.kv{margin:0}
.triad{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:22px;padding:10px;overflow-x:auto}
.triad svg{display:block;width:100%;min-width:560px;height:auto}
.mbars{display:grid;gap:8px;max-width:640px}
.mbar{display:grid;grid-template-columns:3em minmax(0,1fr) 5.5em;gap:10px;align-items:center;font-size:14px}
.mbar .tr{display:flex;height:12px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.05)}
.mbar .tr span{height:100%}
.mbar .ct{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.keys{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
